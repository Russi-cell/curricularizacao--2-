<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fcdfb"/>
      <stop offset="0.55" stop-color="#b9e6ff"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8c9" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fff3a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="morro1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4e6a6"/>
      <stop offset="1" stop-color="#9bd98f"/>
    </linearGradient>
    <linearGradient id="morro2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd77f"/>
      <stop offset="1" stop-color="#76c96d"/>
    </linearGradient>
    <linearGradient id="morro3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed05f"/>
      <stop offset="1" stop-color="#4fb04f"/>
    </linearGradient>
    <linearGradient id="rio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3f2"/>
      <stop offset="1" stop-color="#6fcbe6"/>
    </linearGradient>
    <g id="nuvem" fill="#ffffff">
      <ellipse cx="0" cy="22" rx="120" ry="30"/>
      <circle cx="-48" cy="0" r="38"/>
      <circle cx="10" cy="-16" r="52"/>
      <circle cx="70" cy="2" r="36"/>
    </g>
    <g id="arvore">
      <rect x="-7" y="0" width="14" height="46" rx="6" fill="#c98f58"/>
      <ellipse cx="0" cy="-26" rx="30" ry="40" fill="#5cbc55"/>
      <ellipse cx="-10" cy="-34" rx="14" ry="20" fill="#78d26a" opacity="0.7"/>
    </g>
  </defs>

  <!-- céu e sol suave -->
  <rect width="1600" height="900" fill="url(#ceu)"/>
  <circle cx="1100" cy="130" r="260" fill="url(#sol)"/>

  <!-- nuvens -->
  <use href="#nuvem" x="420" y="120" opacity="0.96"/>
  <use href="#nuvem" x="650" y="90" opacity="0.9" transform="translate(650 90) scale(0.7) translate(-650 -90)"/>
  <use href="#nuvem" x="1190" y="330" opacity="0.92" transform="translate(1190 330) scale(0.85) translate(-1190 -330)"/>
  <use href="#nuvem" x="1380" y="170" opacity="0.95" transform="translate(1380 170) scale(0.8) translate(-1380 -170)"/>
  <use href="#nuvem" x="90" y="380" opacity="0.85" transform="translate(90 380) scale(0.55) translate(-90 -380)"/>


  <!-- passarinhos (nas laterais do céu) -->
  <g stroke="#4a6fa5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M170 250 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M270 200 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M1290 250 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M1390 300 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- morros ao fundo -->
  <path d="M0 520 Q240 380 520 470 T1060 440 T1600 480 L1600 900 L0 900 Z" fill="url(#morro1)"/>
  <path d="M0 600 Q300 480 640 570 T1240 540 T1600 590 L1600 900 L0 900 Z" fill="url(#morro2)"/>

  <!-- casinhas distantes -->
  <g opacity="0.85">
    <rect x="1180" y="498" width="34" height="24" rx="3" fill="#f6dcb6"/>
    <path d="M1174 500 L1197 482 L1220 500 Z" fill="#e58a72"/>
    <rect x="1230" y="506" width="28" height="20" rx="3" fill="#f4e7c8"/>
    <path d="M1225 508 L1244 492 L1263 508 Z" fill="#d97c6a"/>
    <rect x="320" y="520" width="30" height="22" rx="3" fill="#f6dcb6"/>
    <path d="M314 522 L335 505 L356 522 Z" fill="#e58a72"/>
  </g>

  <!-- rio -->
  <path d="M-20 690 Q260 640 560 676 T1140 664 T1640 690 L1640 760 Q1300 730 1000 742 T420 748 T-20 764 Z" fill="url(#rio)"/>
  <path d="M120 706 Q220 698 320 708" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M900 700 Q1010 692 1120 702" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" fill="none"/>


  <!-- ponte de pedra sobre o rio (lado direito, longe do centro da tela) -->
  <g>
    <path d="M1020 676 Q1190 620 1360 676 L1360 736 L1020 736 Z" fill="#efe3cc"/>
    <path d="M1048 736 Q1105 676 1162 736 Z" fill="#7fcfe6"/>
    <path d="M1218 736 Q1275 676 1332 736 Z" fill="#7fcfe6"/>
    <path d="M1020 676 Q1190 620 1360 676" stroke="#d8c7a4" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M1030 667 Q1190 613 1350 667" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" fill="none"/>
  </g>

  <!-- morro da frente -->
  <path d="M0 740 Q320 690 700 730 T1300 716 T1600 744 L1600 900 L0 900 Z" fill="url(#morro3)"/>

  <!-- caminho -->
  <path d="M-10 900 Q120 820 260 800 Q420 776 520 742 L580 742 Q500 800 360 830 Q230 856 190 900 Z" fill="#f2dfb7" opacity="0.95"/>

  <!-- árvores das laterais -->
  <use href="#arvore" transform="translate(110 596) scale(1.5)"/>
  <use href="#arvore" transform="translate(230 626) scale(1.15)"/>
  <use href="#arvore" transform="translate(1500 590) scale(1.55)"/>
  <use href="#arvore" transform="translate(1390 628) scale(1.1)"/>
  <use href="#arvore" transform="translate(420 566) scale(0.7)"/>
  <use href="#arvore" transform="translate(1210 572) scale(0.75)"/>

  <!-- flores e detalhes -->
  <g>
    <circle cx="700" cy="812" r="7" fill="#ffd45e"/><circle cx="730" cy="830" r="6" fill="#ff8fa3"/>
    <circle cx="860" cy="800" r="6" fill="#ffffff"/><circle cx="1010" cy="826" r="7" fill="#ffd45e"/>
    <circle cx="1180" cy="806" r="6" fill="#ff8fa3"/><circle cx="1290" cy="842" r="7" fill="#ffffff"/>
    <circle cx="520" cy="860" r="6" fill="#ffffff"/><circle cx="960" cy="868" r="6" fill="#ff8fa3"/>
  </g>
</svg>
